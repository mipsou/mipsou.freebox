---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ansible-test requires the collection to be checked out at
# ansible_collections/<namespace>/<name>. Every job replicates that layout.
env:
  COLLECTION_PATH: ansible_collections/mipsou/freebox

jobs:
  sanity:
    name: Sanity (${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: stable-2.16
            python: '3.11'
          - ansible: stable-2.17
            python: '3.11'
          - ansible: devel
            python: '3.12'
    steps:
      - name: Check out collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core (${{ matrix.ansible }})
        run: pip install --disable-pip-version-check
          https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz

      - name: Run sanity tests
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-test sanity --docker default -v --color

  units:
    name: Units (${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: stable-2.16
            python: '3.11'
          - ansible: stable-2.17
            python: '3.11'
          - ansible: devel
            python: '3.12'
    steps:
      - name: Check out collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core (${{ matrix.ansible }})
        run: pip install --disable-pip-version-check
          https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz

      - name: Run unit tests
        working-directory: ${{ env.COLLECTION_PATH }}
        # --python 3.12 explicitly skips py2.7 (still enabled by default in
        # stable-2.16's legacy.ini config for module-side compat testing).
        # The collection targets ansible-core 2.15+ which dropped py2.7 long
        # ago, so testing under it is academic and incompatible with our
        # source style (em dashes, etc.).
        run: ansible-test units --docker default --python 3.12 -v --color

  build:
    name: Build tarball
    runs-on: ubuntu-latest
    needs: [sanity, units]
    steps:
      - name: Check out collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-core
        run: pip install --disable-pip-version-check ansible-core

      - name: Build collection
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-galaxy collection build --output-path dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mipsou-freebox-collection
          path: ${{ env.COLLECTION_PATH }}/dist/*.tar.gz
          if-no-files-found: error
