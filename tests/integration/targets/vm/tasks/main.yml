---
# Integration test for mipsou.freebox.vm.
#
# Safe subset — no image, no disk space, no VM cap hit:
#   1. state=absent on a non-existent VM name → noop (GET /vm/ read-only)
#   2. state=present + check_mode on non-existent VM → changed=true, no create

- name: state=absent on non-existent VM — noop
  mipsou.freebox.vm:
    url: "{{ freebox_url }}"
    app_id: "{{ freebox_app_id }}"
    app_token: "{{ freebox_app_token }}"
    name: ansible-test-ghost-vm
    state: absent
  register: absent_noop

- name: assert noop (VM was not there)
  ansible.builtin.assert:
    that:
      - not absent_noop.changed
      - absent_noop.vm is none

- name: check_mode create — assert would-change without writing
  mipsou.freebox.vm:
    url: "{{ freebox_url }}"
    app_id: "{{ freebox_app_id }}"
    app_token: "{{ freebox_app_token }}"
    name: ansible-test-ghost-vm
    state: present
    vcpus: 1
    memory: 256
  check_mode: true
  register: create_check

- name: assert check_mode signals create without touching the Freebox
  ansible.builtin.assert:
    that:
      - create_check.changed
      - create_check.vm is none
