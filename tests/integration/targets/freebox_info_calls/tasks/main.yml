---
# Integration test for mipsou.freebox.info_calls
#
# Required vars (integration_config.yml):
#   freebox_url, freebox_app_id, freebox_app_token

- name: Gather call log facts
  mipsou.freebox.info_calls:
    url: "{{ freebox_url }}"
    app_id: "{{ freebox_app_id }}"
    app_token: "{{ freebox_app_token }}"
  register: calls_facts

- name: Assert facts structure
  ansible.builtin.assert:
    that:
      - not calls_facts.changed
      - calls_facts.ansible_facts.freebox_calls is defined
      - calls_facts.ansible_facts.freebox_calls is iterable
