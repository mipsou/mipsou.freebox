---
# Integration test for mipsou.freebox.fs_file.
#
# Safe subset — no fixture file or writable NAS path required:
#   1. state=absent on a non-existent path → noop (changed=false)
#   2. state=present with no src on a non-existent path → documented fail

- name: state=absent on non-existent file — noop
  mipsou.freebox.fs_file:
    url: "{{ freebox_url }}"
    app_id: "{{ freebox_app_id }}"
    app_token: "{{ freebox_app_token }}"
    path: /Disque 1/ansible_test_ghost_file.txt
    state: absent
  register: absent_noop

- name: assert noop (file was not there)
  ansible.builtin.assert:
    that:
      - not absent_noop.changed
      - absent_noop.state == "absent"

- name: state=present with no src on non-existent path — expected fail
  mipsou.freebox.fs_file:
    url: "{{ freebox_url }}"
    app_id: "{{ freebox_app_id }}"
    app_token: "{{ freebox_app_token }}"
    path: /Disque 1/ansible_test_ghost_file.txt
    state: present
  register: no_src_fail
  ignore_errors: true

- name: assert failed with expected message
  ansible.builtin.assert:
    that:
      - no_src_fail is failed
      - "'does not exist and no src was provided' in no_src_fail.msg"
