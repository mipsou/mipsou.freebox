---
# Integration test for mipsou.freebox.info_switch
#
# Required vars (integration_config.yml):
#   freebox_url, freebox_app_id, freebox_app_token

- name: Gather switch facts
  mipsou.freebox.info_switch:
    url: "{{ freebox_url }}"
    app_id: "{{ freebox_app_id }}"
    app_token: "{{ freebox_app_token }}"
  register: switch_facts

- name: Assert facts structure
  ansible.builtin.assert:
    that:
      - not switch_facts.changed
      - switch_facts.ansible_facts.freebox_switch is defined
