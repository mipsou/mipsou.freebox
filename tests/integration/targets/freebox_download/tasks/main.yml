---
# Integration test: mipsou.freebox.download
# Read-only: lists current download tasks. No task is added or deleted.

- name: gather download tasks
  mipsou.freebox.download:
    url: "{{ freebox_url }}"
    app_id: "{{ freebox_app_id }}"
    app_token: "{{ freebox_app_token }}"
  register: result

- name: assert tasks list returned
  ansible.builtin.assert:
    that:
      - result.tasks is defined
      - result.tasks is iterable
      - result.changed is false
